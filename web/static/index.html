<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dogfight M2 · Web Observer</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="stage">
  <canvas id="scene"></canvas>
  <div id="stripes"></div>
  <div id="vignette"></div>

  <div id="hud">
    <div id="attitude-panel"></div>
    <div id="missile-status" class="hidden"></div>
    <div id="stations"></div>
    <div id="bottom-hint"></div>
    <div id="bottom-bar"></div>
    <div id="paused-label" class="hidden">PAUSED</div>
    <div id="result-overlay" class="hidden"></div>
    <div id="controls">
      <button id="btn-pause" type="button">PAUSE</button>
      <button id="btn-reset" type="button">RESET</button>
      <button id="btn-follow" type="button">FOLLOW: OFF</button>
    </div>
  </div>
</div>

<script src="/static/vendor/three.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
