# 1v1 对照实验：J-20A vs F-15EX，15 km 对头，600 s 时限，双方雷达常开。
# 用于观察“一开局就进入近距缠斗”时的胜负与弹种结构。
id: j20a-f15ex-15km
time_limit_s: 600
physics_dt_s: 0.008333333333333333   # 1/120 s
decision_hz: 10

initial:
  spacing_m: 7500           # 每架距空域中心 7.5 km，总间距 15 km
  altitude_m: 9000
  y_offset_m: 100
  floor_m: 1500
  ceiling_m: 30000
  arena_m: 200000

teams:
  - name: red
    aircraft: J-20A
    loadout:
      ir:
        weapon: PL-10
        count: 6                # 全近距挂载（与 F-15EX 同为 6 枚）
      radar:
        weapon: PL-15
        count: 0                # 全近距挂载：不挂中距弹
      countermeasures:
        chaff: 30
        flare: 24
    radar_policy: auto
  - name: blue
    aircraft: F-15EX
    loadout:
      ir:
        weapon: AIM-9X
        count: 6                # 全近距挂载（与 J-20A 同为 6 枚）
      radar:
        weapon: AIM-120C
        count: 0                # 全近距挂载：不挂中距弹
      countermeasures:
        chaff: 30
        flare: 60
    radar_policy: auto

awacs: false
# seed 由实验脚本逐局传入；不在场景里固定，避免覆盖随机化。
