# 2v2 多机对抗：J-20A 双机 vs F-15EX 双机，80 km 对头，600 s 时限。
# 双方各 2 架，同队横向间隔 3 km；无预警机支援，雷达 auto。
# 红方双机前出扫荡，蓝方双机值班拦截。
id: j20a-f15ex-2v2
brief: 红方双机前出扫荡，蓝方双机担任值班拦截；双方 80 km 对头，开场编队随机展开。
time_limit_s: 600
physics_dt_s: 0.008333333333333333   # 1/120 s
decision_hz: 10

initial:
  spacing_m: 40000          # 每队距空域中心 40 km，总间距 80 km
  altitude_m: 10000
  y_offset_m: 100
  lane_m: 3000              # 同队两机的横向间隔
  floor_m: 1500
  ceiling_m: 30000
  arena_m: 200000

teams:
  - name: red
    side: attacker
    formation_group: [echelon, fighting_wing, spread]
    mission: sweep
    radar_policy: auto
    aircraft:
      - id: J-20A
        callsign: Dragon1
        role: fighter
        rank: flight_lead
        loadout:
          ir: {weapon: PL-10, count: 2}
          radar: {weapon: PL-15, count: 4}
          countermeasures: {chaff: 30, flare: 24}
      - id: J-20A
        callsign: Dragon2
        role: fighter
        rank: wingman
        loadout:
          ir: {weapon: PL-10, count: 2}
          radar: {weapon: PL-15, count: 4}
          countermeasures: {chaff: 30, flare: 24}
  - name: blue
    side: defender
    formation_group: [echelon, spread]
    mission: intercept
    radar_policy: auto
    aircraft:
      - id: F-15EX
        callsign: Eagle1
        role: fighter
        rank: flight_lead
        loadout:
          ir: {weapon: AIM-9X, count: 2}
          radar: {weapon: AIM-120C, count: 4}
          countermeasures: {chaff: 30, flare: 60}
      - id: F-15EX
        callsign: Eagle2
        role: fighter
        rank: wingman
        loadout:
          ir: {weapon: AIM-9X, count: 2}
          radar: {weapon: AIM-120C, count: 4}
          countermeasures: {chaff: 30, flare: 60}

awacs: false

rules:
  roe: weapons_free
  team_brain: true
  no_fire_zones: []
# seed 由实验脚本逐局传入；不在场景里固定，避免覆盖随机化。
