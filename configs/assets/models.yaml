# 资产注册表：把“哪个机体用哪个 OBJ、按多长缩放”从代码里分离。
# 路径相对仓库根目录；新增机体/武器只需在这里加一项，three.js 导出、Web 兜底与轮廓生成会自动加载。
# 机体只需要四个量：真实机长、体素抽稀尺度（米）、原始 OBJ、以及该 OBJ 的坐标换算器。
# aircraft 的键必须与 configs/aircraft/*.yaml 里的 name 一致。
version: web-obj-v10

aircraft:
  SU-57:
    length_m: 20.1
    # 兜底模型与俯视轮廓的体素尺度；原始 OBJ 直接取 web.source。
    voxel_m: 0.30
    web:
      source: assets/aircraft/SU57.obj
      file: su57.obj
      converter: su57

  F-16V:
    length_m: 15.06
    voxel_m: 0.28
    # 俯视轮廓 / 兜底模型只保留机体蒙皮与座舱玻璃；
    # 翼下导弹、副油箱、起落架在抽稀后会变成多余尖刺，Web 端仍渲染完整模型。
    keep_materials:
      - main_body.005
      - glass.002
    web:
      source: assets/aircraft/F16.obj
      file: f16.obj
      converter: f16

  J-20A:
    length_m: 21.2
    voxel_m: 0.32
    web:
      # 含全动鸭翼、全动双垂尾、DSI 进气道；机头 +Z、+Y 向上。
      source: assets/aircraft/J20.obj
      file: j20.obj
      converter: j20

  J-20S:
    length_m: 21.2
    voxel_m: 0.32
    web:
      # 与 J-20A 共用模型，仅座舱盖外形差异（双座），可由同一 OBJ 渲染。
      source: assets/aircraft/J20.obj
      file: j20s.obj
      converter: j20

  J-16:
    length_m: 21.9
    voxel_m: 0.32
    web:
      # 双座重型多用途型，机头 −X、+Y 向上；模型自带全套挂载。
      source: assets/aircraft/j_16.obj
      file: j16.obj
      converter: j16
      # 原始 99 万面：4 cm 体素 + 二次误差定位代表点（薄翼面厚度只有 7 cm，
      # 体素再大就会把内外蒙皮并到一起，表面出现台阶），导出约 17 万面。
      decimate_m: 0.04
      # 与 J-15T 同一套涂装链路：烘焙 MTL 里的 DDS 颜色/法线贴图。
      textures: true

  J-15T:
    length_m: 21.9
    voxel_m: 0.32
    web:
      # 弹射型舰载机，与 J-16 同一轴向约定。
      source: assets/aircraft/j_15t.obj
      file: j15t.obj
      converter: j15t
      # 原始 79 万面，同样按 4 cm 体素 + 二次误差抽稀，导出约 16 万面。
      decimate_m: 0.04
      # 模型自带 MTL 与 DDS 涂装：烘焙机体颜色的贴图交给前端，
      # 覆盖程序化迷彩（导出时会缩到 2048 并转 WebP）。
      textures: true

  F-15C:
    length_m: 19.43
    voxel_m: 0.30
    web:
      # 单座、无保形油箱；机头 +Z、+Y 向上。
      source: assets/aircraft/F-15C.obj
      file: f15c.obj
      converter: f15

  F-15E:
    length_m: 19.43
    voxel_m: 0.30
    web:
      # 与 F-15EX 共用同一原始模型，差异由涂装与挂载表达。
      source: assets/aircraft/F-15EX.obj
      file: f15e.obj
      converter: f15

  F-15EX:
    length_m: 19.43
    voxel_m: 0.30
    web:
      # 双座、带保形油箱（CFT）的 F-15EX 模型。
      source: assets/aircraft/F-15EX.obj
      file: f15ex.obj
      converter: f15

missiles:
  R-73:
    source: assets/missiles/R73.obj
    length_m: 2.90
    file: r73.obj
  AIM-9X:
    source: assets/missiles/AIM9.obj
    length_m: 3.02
    file: aim9.obj
  R-77-1:
    source: assets/missiles/R77.obj
    length_m: 3.60
    file: r77.obj
  AIM-120C:
    source: assets/missiles/AIM120.obj
    length_m: 3.66
    file: aim120.obj
  PL-10:
    source: assets/missiles/PL-10.obj
    length_m: 3.00
    file: pl10.obj
  PL-15:
    source: assets/missiles/PL-15.obj
    length_m: 3.85
    file: pl15.obj
