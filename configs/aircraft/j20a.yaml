# J-20A：双发重型隐身，升力体+边条+全动鸭翼；偏角度与瞬盘。
id: J-20A
name: J-20A

airframe:
  # 空机 + 半油（17,000 + 5,950 ≈ 22,950，取整 24,000 含飞行员与设备）。
  base_mass_kg: 24000
  wing_area_m2: 73.0
  cl_max: 1.6
  n_struct_g: 9
  thrust_max_kn: 360        # WS-15 双发加力（180 kN × 2）
  thrust_mil_kn: 220        # 双发军用推力
  cd0: 0.035
  aspect_ratio: 2.32        # 翼展 13.01 m / 面积 73.0 m²
  oswald: 0.78
  cl_alpha: 3.80
  cruise_mach: 1.30         # WS-15 不开加力超巡
  fuel_capacity_kg: 11900
  lapse_exp: 0.65
  ram_r0: 0.15
  ram_r1: 0.20
  derate_z_m: 18000
  derate_H_m: 6000
  eta_install: 0.95
  hp_max: 115
  # 有公开消息称 J-20 已装 GSh-30-1 型 30 mm 机炮（内埋于机身/翼下炮舱），
  # 与 Su-57 同型；公开资料未给出确切备弹量，按同型炮常见的 150 发计。
  gun_range_m: 1000
  gun_dps: 30
  ammo_max: 150
  rounds_per_sec: 25
  length_m: 21.2
  muzzle_speed: 900
  bullet_mass_kg: 0.390
  bullet_diameter_m: 0.030
  gun_spread: 0.003
  # 无推力矢量喷口（WS-15 后期批次或配二元矢量，当前按无 TVC）。
  tvc_deg: 0
  tvc_alpha_max_deg: 0
  tvc_cl_bonus: 0.0
  # 全动鸭翼：按公开外形近似取两片总面积约 10.2 m²（0.14 S），
  # 气动中心在重心前约 1.25 倍平均气动弦。
  canard: true
  canard_area_ratio: 0.14
  canard_arm_ratio: 1.25
  canard_chord_m: 1.45
  canard_deflect_max_deg: 25
  canard_rate_max_deg_s: 40
  canard_tau_s: 0.12
  canard_cl_alpha: 3.6
  canard_cl_max: 1.5
  canard_alpha_stall_deg: 20
  canard_downwash: 0.10
  # 全动鸭翼绕转轴的铰链力矩系数远小于襟翼式舵面（约 0.05 量级），
  # 35 kN·m 的作动器在常规动压/迎角下仍能保持全偏度，只在极高动压
  # 或过失速大迎角时进入力矩饱和。
  canard_hinge_coeff: 0.06
  canard_actuator_torque_knm: 35
  canard_post_stall_alpha_deg: 35
  # 涡增升只作用于主翼（+0.15 CLmax）；鸭翼自身升力由面积/CL 单独计入，
  # 避免与“鸭翼升力”重复。失速角右移 8°，与涡饱和角 30° 分开定义，
  # 不再叠加 ΔCL/CLα，消除此前的三重定义不一致。
  canard_cl_bonus: 0.15
  canard_alpha_max_deg: 30
  canard_stall_shift_deg: 8
  #   dCm/dα = cm_alpha + (S_c/S)·(l_c/c)·CLα_c
  #           = -0.65 + 0.14×1.25×3.6 = -0.02 ≈ 中立稳定
  # 鸭翼翼面 AR≈4.9，三维升力斜率取 3.6/rad（含机身干扰），失速 20°。
  # 过于稳定（-1.0）会让鸭翼在 α≈6° 就到达力矩上限；取 -0.40 则净导数
  # 为正（静不稳定），配平会振荡。中立稳定 + FBW 是鸭翼战斗机的典型布局。
  # 无平尾，俯仰完全由全动鸭翼提供，因此 cm_de = 0。
  cm_alpha: -0.65
  cm_de: 0.0

sensors:
  # 正面 RCS 与 F-22 归一到同一数量级（F-22 取 0.001 m² = −30 dBsm，
  # J-20 取 0.002 m² = −27 dBsm，仅高 3 dB）。公开资料的原始区间差异很大
  # （F-22 0.0001–0.001 m²，J-20 0.01–0.05 m²），此处按“同级、J-20 略高”
  # 的仿真口径统一标定，仅用于相对比较；单位换算见文档 §1.3.1。
  rcs: 0.002
  rcs_front: 0.002
  rcs_side: 0.5
  rcs_back: 1.0
  radar_range_km: 200        # 1475/KLJ-5 AESA
  side_array: true
  lband: false
  irst_range_km: 60          # 内置 EOTS

loadout:
  ir:
    weapon: PL-10
    count: 4                # 侧弹舱各 2 枚（与 F-15EX 统一为 4 近 2 中）
  radar:
    weapon: PL-15
    count: 2                # 主弹舱 2 枚
  countermeasures:
    chaff: 30
    flare: 24

agent:
  aggression: 0.82
  energy_pref: 0.55
  lure: true
  style: angle
